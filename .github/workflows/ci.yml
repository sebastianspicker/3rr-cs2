# Build and deployment checks run in parallel. The final `verify` job is the
# required aggregate status check.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared:
    name: Verify (shared)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install YAML tooling
        run: sudo apt-get update && sudo apt-get install -y ruby

      - name: Validate deployment contract and configuration
        run: |
          bash scripts/check-deployment-contract.sh
          ruby -ryaml -e 'ARGV.each { |path| YAML.safe_load_file(path, aliases: false) }' deploy/compose/*.yaml
          git diff --check

  control-plane:
    name: Verify (control-plane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.9.0
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        working-directory: control-plane
        run: npm ci

      - name: Typecheck and build
        working-directory: control-plane
        run: npm run typecheck && npm run build

  docker:
    name: Verify (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.9.0
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install validation tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt jq ruby

      - name: Validate container and Compose configuration
        working-directory: control-plane
        run: npm ci && npm run validate -- --require-docker

  host-updater:
    name: Verify (host-updater)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check updater scripts
        run: |
          bash -n host-updater/3rr-update.sh host-updater/lib/*.sh
          shellcheck -x -P host-updater host-updater/3rr-update.sh host-updater/lib/*.sh

  bootstrap:
    name: Verify (bootstrap)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check bootstrap scripts and manifest
        run: |
          jq -e . server-bootstrap/capabilities.json > /dev/null
          bash -n server-bootstrap/scripts/*.sh

  verify:
    name: verify
    needs:
      - shared
      - control-plane
      - docker
      - host-updater
      - bootstrap
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs to succeed
        run: |
          if [ "${{ needs.shared.result }}" != "success" ] ||
            [ "${{ needs.control-plane.result }}" != "success" ] ||
            [ "${{ needs.docker.result }}" != "success" ] ||
            [ "${{ needs.host-updater.result }}" != "success" ] ||
            [ "${{ needs.bootstrap.result }}" != "success" ]; then
            echo "One or more verification jobs did not succeed." >&2
            exit 1
          fi

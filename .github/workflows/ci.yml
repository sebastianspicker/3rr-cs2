# The repository verifier is the single CI entry point for all three modules.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/operate/panel/package-lock.json

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt jq ruby

      - name: Verify repository
        env:
          COVERAGE_OUTPUT: ${{ runner.temp }}/3rr-panel-coverage.lcov
        run: ./scripts/verify.sh

      - name: Upload panel coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: panel-lcov
          path: ${{ runner.temp }}/3rr-panel-coverage.lcov
          if-no-files-found: error
          retention-days: 14

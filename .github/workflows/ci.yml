# The repository verifier is the single CI entry point for all three modules,
# split into parallel jobs by section (see `scripts/verify.sh --help`). The
# final `verify` job aggregates their results and is the required status check.
name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: Verify (shared)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt jq ruby

      - name: Verify repository
        run: ./scripts/verify.sh --only shared

  control-plane:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: Verify (control-plane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        working-directory: control-plane
        run: npm ci

      - name: Verify repository
        run: ./scripts/verify.sh --only control-plane

  docker:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: Verify (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt jq ruby

      - name: Verify repository
        run: ./scripts/verify.sh --only docker

  host-updater:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: Verify (host-updater)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: Verify repository
        run: ./scripts/verify.sh --only host-updater

  bootstrap:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: Verify (bootstrap)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Verify repository
        run: ./scripts/verify.sh --only bootstrap

  verify:
    name: verify
    needs:
      - shared
      - control-plane
      - docker
      - host-updater
      - bootstrap
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs to succeed
        run: |
          if [ "${{ needs.shared.result }}" != "success" ] ||
            [ "${{ needs.control-plane.result }}" != "success" ] ||
            [ "${{ needs.docker.result }}" != "success" ] ||
            [ "${{ needs.host-updater.result }}" != "success" ] ||
            [ "${{ needs.bootstrap.result }}" != "success" ]; then
            echo "One or more verification jobs did not succeed." >&2
            exit 1
          fi

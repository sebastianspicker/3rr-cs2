name: Feature request
description: Suggest an improvement to 3RR.
title: "[Feature]: "
body:
  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - control plane
        - host updater
        - server bootstrap
        - shared configuration or documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the task you are trying to complete and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed improvement
      description: Explain what you would like to do and how the change would help.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Compatibility and deployment
      description: If known, describe any changes to permissions, RCON access, stored data, or deployment.
  - type: checkboxes
    id: scope
    attributes:
      label: Before posting
      options:
        - label: The proposal does not require the control plane to run host commands or SteamCMD.
          required: true

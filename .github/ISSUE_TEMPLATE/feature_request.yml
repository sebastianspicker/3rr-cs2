# Feature requests must preserve the module boundaries.
name: Feature request
description: Propose a bounded operator-facing improvement.
title: "[Feature]: "
body:
  - type: dropdown
    id: module
    attributes:
      label: Intended module
      options:
        - control plane
        - host updater
        - server bootstrap
        - shared configuration or documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Describe the problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain how an operator would know the change works.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and risks
      description: Note privilege, RCON, persistence, compatibility, and deployment implications.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: The proposal does not require the control plane to run host commands or SteamCMD.
          required: true

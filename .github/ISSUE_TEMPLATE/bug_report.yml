name: Bug report
description: Report a problem you can reproduce in 3RR.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe what went wrong and how to reproduce it. Remove passwords,
        tokens, private network details, and RCON credentials before posting.
  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - control plane
        - host updater
        - server bootstrap
        - shared configuration or documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the release tag or full commit SHA, if you have it.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the steps someone else can follow to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets, usernames, hostnames, and private network details.
  - type: checkboxes
    id: checks
    attributes:
      label: Before posting
      options:
        - label: I removed credentials and sensitive infrastructure details.
          required: true
        - label: This is not a vulnerability report.
          required: true

# Copy `../../../apps/operate/panel/.env.example` to a local env file such as
# `./panel.env`, set real secrets there, then export them or pass
# `docker compose --env-file ./panel.env ...`.
services:
  panel:
    build:
      context: ../../../apps/operate/panel
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_PATH: /home/container/data/3rr.db
      SESSION_SECRET: ${SESSION_SECRET:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RCON_SECRET_KEY: ${RCON_SECRET_KEY:-}
      # Keep false when the published port is reachable directly. Set 1 only
      # when every request is guaranteed to traverse one trusted proxy hop.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${PANEL_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - panel-data:/home/container/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - panel-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  panel-data:
  panel-redis:

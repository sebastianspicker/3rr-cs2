# Export runtime variables from a local env file before `docker compose up`, or
# pass them explicitly with `docker compose --env-file ./server.env ...`.
# Generate administrator bootstrap assets into `./bootstrap/` with
# `server-bootstrap/scripts/bootstrap-admins.sh`.
services:
  cs2-runtime:
    # Set CS2_IMAGE to a reviewed immutable reference such as
    # registry.example/cs2@sha256:<64 hex characters>. No digest is supplied
    # here because operators must select and record the artifact they tested.
    image: "${CS2_IMAGE:?Set CS2_IMAGE to a reviewed immutable image reference with a sha256 digest}"
    container_name: cs2-runtime
    entrypoint:
      - /bin/bash
      - /opt/3rr/server-start.sh
    environment:
      CS2_INSTALL_DIR: /home/steam/cs2-dedicated
      CS2_HOSTNAME: ${CS2_HOSTNAME:-Example CS2 Server}
      CS2_MAP: ${CS2_MAP:-de_dust2}
      CS2_PORT: ${CS2_PORT:-27015}
      CS2_MAXPLAYERS: ${CS2_MAXPLAYERS:-16}
      CS2_GSLT: ${CS2_GSLT:-}
      CS2_CFG_FILE: ${CS2_CFG_FILE:-server.cfg}
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      CSS_ADMINS_FILE: /bootstrap/admins.json
      CSS_GROUPS_FILE: /bootstrap/admin_groups.json
      CS2_CFG_BUNDLE_DIR: /opt/3rr/cfg-assets
    ports:
      - "${CS2_PORT:-27015}:${CS2_PORT:-27015}/udp"
      - "${CS2_PORT:-27015}:${CS2_PORT:-27015}/tcp"
    volumes:
      - cs2-runtime-data:/home/steam/cs2-dedicated
      - ../../server-bootstrap/scripts/server-start.sh:/opt/3rr/server-start.sh:ro
      - ../../server-bootstrap/assets/cfg:/opt/3rr/cfg-assets:ro
      - ./bootstrap:/bootstrap:ro
    restart: unless-stopped

volumes:
  cs2-runtime-data:
